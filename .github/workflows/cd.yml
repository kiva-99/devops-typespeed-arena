name: CD

on:
  push:
    branches:
      - feature/jenkins-setup
  workflow_dispatch:

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/jenkins-setup

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i $HOME/yandex-cloud -n
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Yandex Cloud credentials
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}' > yc-key.json
          yc config profile create github-actions || true
          yc config set service-account-key yc-key.json
          yc config set cloud-id b1g7n8p29nt9r3i5e3m5
          yc config set folder-id b1g04tcucevnnibrg2r7

      - name: Allow GitHub runner SSH access
        run: |
          RUNNER_IP="$(curl -fsS https://api.ipify.org)"
          RULE_DESC="github-actions-cd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Runner IP: ${RUNNER_IP}"
          echo "GITHUB_SG_RULE_DESC=${RULE_DESC}" >> "$GITHUB_ENV"

          yc vpc security-group update-rules \
            --id "${{ secrets.APP_SECURITY_GROUP_ID }}" \
            --add-rule "direction=ingress,protocol=tcp,port=22,v4-cidrs=${RUNNER_IP}/32,description=${RULE_DESC}"

          RULE_ID="$(yc vpc security-group get --id "${{ secrets.APP_SECURITY_GROUP_ID }}" --format json | jq -r --arg desc "$RULE_DESC" '.rules[] | select(.description == $desc) | .id' | head -n 1)"

          echo "Created SG rule: ${RULE_ID}"
          echo "GITHUB_SG_RULE_ID=${RULE_ID}" >> "$GITHUB_ENV"

      - name: Configure Docker for Yandex Container Registry
        run: |
          yc container registry configure-docker

      - name: Build backend image
        run: |
          docker build \
            -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/typespeed-backend:${{ github.sha }} \
            -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/typespeed-backend:latest \
            app/backend

      - name: Push backend image
        run: |
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/typespeed-backend:${{ github.sha }}
          docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/typespeed-backend:latest

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo '${{ secrets.APP_SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 20 -H ${{ secrets.APP_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend with rollback
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} '
            set -e

            APP_DIR="/opt/typespeed-arena"
            REGISTRY="cr.yandex/${{ secrets.YC_REGISTRY_ID }}"
            NEW_IMAGE="${REGISTRY}/typespeed-backend:${{ github.sha }}"
            IMAGE_ENV_FILE="${APP_DIR}/backend-image.env"

            cd "$APP_DIR"

            if ! command -v jq >/dev/null 2>&1; then
              echo "[deploy] Installing jq for JSON health validation"
              sudo apt-get update
              sudo apt-get install -y jq
            fi

            if [ -f "$IMAGE_ENV_FILE" ]; then
              CURRENT_IMAGE="$(grep "^BACKEND_IMAGE=" "$IMAGE_ENV_FILE" | cut -d= -f2-)"
            else
              CURRENT_IMAGE="$(docker inspect --format={{.Config.Image}} typespeed-backend 2>/dev/null || true)"
            fi

            if [ -z "$CURRENT_IMAGE" ]; then
              CURRENT_IMAGE="${REGISTRY}/typespeed-backend:latest"
            fi

            echo "[deploy] Previous image: ${CURRENT_IMAGE}"
            echo "[deploy] New image: ${NEW_IMAGE}"

            printf "BACKEND_IMAGE=%s\n" "$NEW_IMAGE" > "$IMAGE_ENV_FILE"

            echo "[deploy] Pulling new image..."
            docker compose --env-file backend-image.env pull backend

            echo "[deploy] Starting backend with new image..."
            docker compose --env-file backend-image.env up -d backend

            echo "[deploy] Waiting for backend health..."
            HEALTH_OK="false"

            for i in $(seq 1 30); do
              if curl -fsS http://localhost:5001/health >/tmp/typespeed-health.json; then
                cat /tmp/typespeed-health.json

                if jq -e ".status == \"healthy\" and .database == \"connected\"" /tmp/typespeed-health.json >/dev/null; then
                  HEALTH_OK="true"
                  break
                fi

                echo "[deploy] Backend health endpoint responded, but JSON status is not healthy"
              fi

              echo "[deploy] Backend is not healthy yet, attempt ${i}/30"
              sleep 2
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "[rollback] New backend image failed healthcheck"
              echo "[rollback] Rolling back to previous image: ${CURRENT_IMAGE}"

              printf "BACKEND_IMAGE=%s\n" "$CURRENT_IMAGE" > "$IMAGE_ENV_FILE"

              docker compose --env-file backend-image.env pull backend || true
              docker compose --env-file backend-image.env up -d backend

              echo "[rollback] Checking previous backend health"
              curl -fsS http://localhost:5001/health >/tmp/typespeed-rollback-health.json
              cat /tmp/typespeed-rollback-health.json
              jq -e ".status == \"healthy\" and .database == \"connected\"" /tmp/typespeed-rollback-health.json >/dev/null

              exit 1
            fi

            echo "[deploy] Backend healthcheck passed"
            echo "[deploy] Ensuring full stack is running"
            docker compose --env-file backend-image.env up -d

            echo "[deploy] Cleaning dangling images"
            docker image prune -f
          '

      - name: Check production health
        run: |
          curl -fsS http://${{ secrets.APP_HOST }}/health | jq -e ".status == \"healthy\" and .database == \"connected\"" >/dev/null

      - name: Remove GitHub runner SSH access
        if: always()
        run: |
          if [ -n "${GITHUB_SG_RULE_ID:-}" ]; then
            yc vpc security-group update-rules \
              --id "${{ secrets.APP_SECURITY_GROUP_ID }}" \
              --delete-rule-id "${GITHUB_SG_RULE_ID}"
          else
            echo "No temporary SG rule id found, skipping cleanup"
          fi
