name: Secrets Check

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i $HOME/yandex-cloud -n
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure YC
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}' > key.json

          yc config profile create github-actions || true
          yc config set service-account-key key.json

      - name: Test YC auth
        run: |
          yc iam service-account list

      - name: Configure Docker auth
        run: |
          yc container registry configure-docker

      - name: Test SSH connectivity
        run: |
          mkdir -p ~/.ssh

          echo '${{ secrets.APP_SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H ${{ secrets.APP_HOST }} >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.APP_USER }}@${{ secrets.APP_HOST }} \
            "hostname && docker ps"
