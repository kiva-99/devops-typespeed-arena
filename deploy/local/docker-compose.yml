# deploy/local/docker-compose.yml
# Локальная оркестрация TypeSpeed Arena

services:
  db:
    image: postgres:15-alpine
    container_name: typespeed-db
    environment:
      POSTGRES_USER: typespeed
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: typespeed_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typespeed"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    image: typespeed-backend:local
    container_name: typespeed-backend
    environment:
      DATABASE_URL: postgresql://typespeed:devpassword123@db:5432/typespeed_db
      PORT: 5000
      DEBUG: "true"
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: typespeed-frontend
    volumes:
      - ../../app/frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
