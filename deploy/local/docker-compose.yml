# deploy/local/docker-compose.yml
# Оркестрация для локального запуска TypeSpeed Arena

# ✅ Убрано: version: '3.8' — в новых версиях Docker Compose это не требуется

services:
  # 🔹 База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: typespeed-db
    environment:
      POSTGRES_USER: typespeed
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: typespeed_db  # ✅ Имя базы: typespeed_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typespeed"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 🔹 Бэкенд на Flask
  backend:
    # ✅ Убрано: build: — оставляем только image, чтобы не было конфликта
    image: python:3.11-slim
    container_name: typespeed-backend
    working_dir: /app
    volumes:
      - ../../app/backend:/app
    # ✅ Используем sh вместо bash для совместимости с Alpine/slim
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python main.py"
    environment:
      # ✅ Убедись, что имя базы совпадает: typespeed_db
      DATABASE_URL: postgresql://typespeed:devpassword123@db:5432/typespeed_db
      PORT: 5000
      DEBUG: "true"
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped  # ✅ Перезапускать при сбое

  # 🔹 Фронтенд: Nginx
  frontend:
    image: nginx:alpine
    container_name: typespeed-frontend
    volumes:
      # ✅ Монтируем ВЕСЬ каталог frontend, а не один файл — надёжнее
      - ../../app/frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

# 🔹 Объявляем тома и сети
volumes:
  db_data:

networks:
  app-network:
    driver: bridge